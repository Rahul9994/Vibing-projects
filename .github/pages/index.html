<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibing projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #02040a; --card: rgba(8, 18, 32, 0.8); --line: rgba(95, 212, 255, 0.22); --cyan: #5fd4ff; --text: #d9e7f5; --muted: #7f93aa; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      background: radial-gradient(circle at 50% 30%, #0b2238 0%, var(--bg) 60%); color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    main { width: min(640px, 100%); }
    h1 { font-family: Rajdhani, sans-serif; font-weight: 700; letter-spacing: 0.24em; font-size: clamp(28px, 6vw, 44px); margin: 0 0 6px; color: #eef8ff; }
    p.sub { margin: 0 0 28px; color: var(--muted); }
    a.card {
      display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 20px 22px;
      border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: inherit; text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--cyan); box-shadow: 0 0 28px rgba(95, 212, 255, 0.2); transform: translateY(-2px); outline: none; }
    .orb { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--cyan); display: grid; place-items: center; box-shadow: 0 0 22px rgba(95, 212, 255, 0.45); }
    .orb::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--cyan)); box-shadow: 0 0 14px var(--cyan); }
    h2 { margin: 0 0 4px; font-family: Rajdhani, sans-serif; font-size: 24px; letter-spacing: 0.18em; color: #eef8ff; }
    .card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14.5px; }
  </style>
</head>
<body>
  <main>
    <h1>VIBING PROJECTS</h1>
    <p class="sub">Things built by vibing with AI.</p>
    <a class="card" href="jarvis/">
      <span class="orb" aria-hidden="true"></span>
      <span>
        <h2>J.A.R.V.I.S.</h2>
        <p>A talking second brain: a 3D galaxy of notes that answers out loud as a witty British butler and flies to its sources.</p>
      </span>
    </a>
  </main>
</body>
</html>
